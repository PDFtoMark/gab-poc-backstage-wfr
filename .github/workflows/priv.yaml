name: PR Review Comment
on:
  workflow_run:
    workflows: [PR Review Comment Trigger]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  re-review:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Read PR Number
        id: pr-number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const [artifact] = allArtifacts.data.artifacts.filter(artifact => artifact.name.startsWith('pr_number-'))
            if (!artifact) {
              throw new Error('No PR Number artifact available')
            }
            const prNumber = artifact.name.slice('pr_number-'.length)
            core.setOutput('pr-number', prNumber);
      - name: Privileged consumer output
        env:
          ISSUE_NUMBER: ${{ steps.pr-number.outputs.pr-number }}
        run: |
          echo "triggering_run=${{ github.event.workflow_run.id }}"
          echo "triggering_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "triggering_head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "RESOLVED_ISSUE_NUMBER=$ISSUE_NUMBER"
